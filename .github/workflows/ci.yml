name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run pytest with branch coverage (Python 3.13)
        if: matrix.python-version == '3.13'
        run: |
          pytest --cov=credweave --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Run pytest (Python ${{ matrix.python-version }})
        if: matrix.python-version != '3.13'
        run: |
          pytest

  lint:
    name: Ruff & Mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .

      - name: Run strict mypy
        run: mypy

  build:
    name: Build & Package Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel installation and clean import outside source tree
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-test-env"
          "${RUNNER_TEMP}/wheel-test-env/bin/python" -m pip install dist/*.whl
          (cd "${RUNNER_TEMP}" && "${RUNNER_TEMP}/wheel-test-env/bin/python" -c "import credweave; print(f'Successfully imported credweave {credweave.__version__} from wheel at {credweave.__file__}')")

      - name: Verify sdist installation and clean import outside source tree
        run: |
          python -m venv "${RUNNER_TEMP}/sdist-test-env"
          "${RUNNER_TEMP}/sdist-test-env/bin/python" -m pip install dist/*.tar.gz
          (cd "${RUNNER_TEMP}" && "${RUNNER_TEMP}/sdist-test-env/bin/python" -c "import credweave; print(f'Successfully imported credweave {credweave.__version__} from sdist at {credweave.__file__}')")
